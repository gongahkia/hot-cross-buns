name: Reproducibility report
description: Report a Wukong result that another maintainer can reproduce safely.
title: "[bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private repository URLs, or unredacted logs.
        Report vulnerabilities through SECURITY.md instead of this form.
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: wukong-version
    attributes:
      label: Wukong version
      placeholder: wukong --version
    validations:
      required: true
  - type: input
    id: godot-version
    attributes:
      label: Godot version
      placeholder: e.g. 4.3.stable
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Minimal manifest
      description: Remove credentials and unrelated dependencies.
      render: toml
    validations:
      required: true
  - type: textarea
    id: lockfile
    attributes:
      label: Safe lockfile
      description: Paste a redacted wukong.lock, or write UNSAFE TO SHARE and explain why.
      render: toml
    validations:
      required: true
  - type: textarea
    id: diagnostic-output
    attributes:
      label: Verbose diagnostic output
      description: Remove secrets. If unavailable, state why and include the command run.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual-behaviour
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Safe disclosure
      options:
        - label: I removed credentials, private URLs, and personally identifying data.
          required: true
