name: Python installation issue
description: Report a uv, pipx, Python, entrypoint, or first-launch problem.
title: "[Install]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for Python installation, dependency, entrypoint, or first-launch issues.
        Do not include credentials, tokens, local databases, or unredacted diagnostics.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - uv tool
        - pipx
        - source checkout
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      placeholder: "macOS 14.6 arm64, Ubuntu 26.04 x64, Windows 11 25H2 x64"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks completed
      options:
        - label: I am using Python 3.12 or newer.
        - label: I tried the command in README.md.
        - label: I included my installer and Python versions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      placeholder: Describe the install, dependency, entrypoint, or first-launch failure.
    validations:
      required: true
  - type: textarea
    id: terminal-output
    attributes:
      label: Redacted terminal output or screenshots
      description: Remove local secrets, account identifiers, tokens, database contents, and raw Google payloads.
    validations:
      required: false
