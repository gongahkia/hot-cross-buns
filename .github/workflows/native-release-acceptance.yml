name: Native release acceptance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: native-release-acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-macos-live-google-attestation:
    name: macOS live Google acceptance attestation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require accepted redacted macOS Google attestation
        run: >-
          bash .github/scripts/check-macos-live-google-acceptance.sh
          docs/testing/macos-live-google-acceptance-v1.json

      - name: Upload macOS Google acceptance attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-live-google-acceptance-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: docs/testing/macos-live-google-acceptance-v1.json

  native-release-acceptance:
    name: Build, test, install, and launch
    needs: native-macos-live-google-attestation
    uses: ./.github/workflows/native-package-install-smoke.yml
