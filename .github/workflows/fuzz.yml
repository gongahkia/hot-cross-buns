name: Fuzz

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parsers:
    name: parser fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install nightly Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz manifest parser
        run: cargo +nightly fuzz run manifest -- -max_total_time=60
      - name: Fuzz lockfile parser
        run: cargo +nightly fuzz run lockfile -- -max_total_time=60
      - name: Fuzz archive extraction
        run: cargo +nightly fuzz run archive -- -max_total_time=60
