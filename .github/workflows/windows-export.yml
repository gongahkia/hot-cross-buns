name: Windows export validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Godot and Windows template
        shell: pwsh
        env:
          GODOT_VERSION: 4.7.1-stable
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION"
          Invoke-WebRequest -Uri "$releaseUrl/Godot_v$env:GODOT_VERSION`_win64.exe.zip" -OutFile "$env:RUNNER_TEMP\godot.zip"
          Invoke-WebRequest -Uri "$releaseUrl/Godot_v$env:GODOT_VERSION`_export_templates.tpz" -OutFile "$env:RUNNER_TEMP\templates.tpz"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot"
          $templateVersion = $env:GODOT_VERSION -replace '-stable$', '.stable'
          $templateDir = Join-Path $env:APPDATA "Godot\export_templates\$templateVersion"
          New-Item -ItemType Directory -Force -Path $templateDir | Out-Null
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip was not found on the runner.' }
          & $sevenZip e "$env:RUNNER_TEMP\templates.tpz" "-o$templateDir" templates/windows_release_x86_64.exe templates/version.txt
          if ($LASTEXITCODE -ne 0) { throw 'Godot template extraction failed.' }
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Recurse -Filter "Godot_v$env:GODOT_VERSION`_win64_console.exe" | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot console executable was not found.' }
          Set-Content -LiteralPath "$env:RUNNER_TEMP\godot-path.txt" -Value $godot.FullName -NoNewline -Encoding ascii
          & $godot.FullName --version
      - name: Import project resources
        shell: pwsh
        run: |
          $godot = Get-Content -LiteralPath "$env:RUNNER_TEMP\godot-path.txt" -Raw
          & $godot --headless --path . --import --verbose
          if ($LASTEXITCODE -ne 0) { throw 'Godot project import failed.' }
      - name: Run Windows headless soak
        shell: pwsh
        run: |
          $godot = Get-Content -LiteralPath "$env:RUNNER_TEMP\godot-path.txt" -Raw
          & $godot --headless --path . --script res://scripts/windows_long_run_stability_test.gd
          if ($LASTEXITCODE -ne 0) { throw 'Windows headless soak failed.' }
      - name: Export and validate Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = Get-Content -LiteralPath "$env:RUNNER_TEMP\godot-path.txt" -Raw
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          & $godot --headless --path . --export-release 'Windows Desktop' artifacts\a-slow-walk.exe
          if ($LASTEXITCODE -ne 0) { throw 'Godot Windows export failed.' }
          $exe = 'artifacts\a-slow-walk.exe'
          $pck = 'artifacts\a-slow-walk.pck'
          if (-not (Test-Path $exe)) { throw 'Windows executable was not exported.' }
          if (-not (Test-Path $pck)) { throw 'Windows PCK was not exported.' }
          $header = [System.IO.File]::ReadAllBytes($exe)[0..1]
          if ($header[0] -ne 0x4d -or $header[1] -ne 0x5a) { throw 'Exported executable has no PE MZ header.' }
          Compress-Archive -LiteralPath $exe, $pck -DestinationPath artifacts\a-slow-walk-windows.zip -Force
          if (-not (Test-Path artifacts\a-slow-walk-windows.zip)) { throw 'Windows artifact archive was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: a-slow-walk-windows
          path: artifacts/a-slow-walk-windows.zip
          if-no-files-found: error
