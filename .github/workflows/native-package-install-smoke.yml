name: Native package install smoke

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: native-package-install-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  native-macos-package-install-smoke:
    name: macOS universal install tree
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restore Qt SDK cache
        id: qt-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: qt-6.11.1-macos-universal-v2-${{ hashFiles('native/dependencies/manifest.json') }}
          path: ${{ runner.temp }}/Qt

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/hcb-aqt-venv"
          "$RUNNER_TEMP/hcb-aqt-venv/bin/python" -m pip install --disable-pip-version-check \
            "git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e"
          "$RUNNER_TEMP/hcb-aqt-venv/bin/python" -m aqt install-qt mac desktop 6.11.1 clang_64 --outputdir "$RUNNER_TEMP/Qt"

      - name: Configure native universal package tree
        run: cmake --preset macos-universal-package -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.11.1/macos"

      - name: Build native universal package tree and tests
        run: cmake --build build/macos-universal-package --parallel 3

      - name: Run native universal package tests
        run: ctest --test-dir build/macos-universal-package --output-on-failure

      - name: Install native universal package tree
        run: cmake --install build/macos-universal-package --prefix "$RUNNER_TEMP/hcb-package-install"

      - name: Smoke installed macOS app
        run: native/packaging/smoke/macos-install-smoke.sh "$RUNNER_TEMP/hcb-package-install"

      - name: Upload macOS package diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-package-install-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/macos-universal-package/CMakeFiles/**

  native-linux-package-install-smoke:
    name: Linux x64 install tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restore Qt SDK cache
        id: qt-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: qt-6.11.1-linux-gcc-64-v2-${{ hashFiles('native/dependencies/manifest.json') }}
          path: ${{ runner.temp }}/Qt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            ninja-build \
            python3-pip \
            python3-venv \
            xvfb
          python3 -m pip install --user cmake==4.2.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/hcb-aqt-venv"
          "$RUNNER_TEMP/hcb-aqt-venv/bin/python" -m pip install --disable-pip-version-check \
            "git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e"
          "$RUNNER_TEMP/hcb-aqt-venv/bin/python" -m aqt install-qt linux desktop 6.11.1 linux_gcc_64 --outputdir "$RUNNER_TEMP/Qt"

      - name: Configure native Linux package tree
        run: cmake --preset linux-x64-package -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.11.1/gcc_64"

      - name: Build native Linux package tree and tests
        run: cmake --build build/linux-x64-package --parallel 3

      - name: Run native Linux package tests
        run: xvfb-run -a ctest --test-dir build/linux-x64-package --output-on-failure

      - name: Install native Linux package tree
        run: cmake --install build/linux-x64-package --prefix "$RUNNER_TEMP/hcb-package-install"

      - name: Smoke installed Linux app
        run: xvfb-run -a native/packaging/smoke/linux-install-smoke.sh "$RUNNER_TEMP/hcb-package-install"

      - name: Upload Linux package diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-package-install-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/linux-x64-package/CMakeFiles/**

  native-windows-package-install-smoke:
    name: Windows x64 install tree
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restore Qt SDK cache
        id: qt-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: qt-6.11.1-windows-msvc2022-64-v2-${{ hashFiles('native/dependencies/manifest.json') }}
          path: ${{ runner.temp }}\Qt

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\hcb-aqt-venv"
          & "$env:RUNNER_TEMP\hcb-aqt-venv\Scripts\python.exe" -m pip install --disable-pip-version-check "git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e"
          & "$env:RUNNER_TEMP\hcb-aqt-venv\Scripts\python.exe" -m aqt install-qt windows desktop 6.11.1 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"

      - name: Configure native Windows package tree
        shell: pwsh
        run: cmake --preset windows-x64-package -A x64 -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP\Qt\6.11.1\msvc2022_64"

      - name: Build native Windows package tree and tests
        run: cmake --build build/windows-x64-package --config Release --parallel 3

      - name: Run native Windows package tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build/windows-x64-package -C Release --output-on-failure

      - name: Install native Windows package tree
        shell: pwsh
        run: cmake --install build/windows-x64-package --config Release --prefix "$env:RUNNER_TEMP\hcb-package-install"

      - name: Smoke installed Windows app
        shell: pwsh
        run: native/packaging/smoke/windows-install-smoke.ps1 -InstallRoot "$env:RUNNER_TEMP\hcb-package-install"

      - name: Upload Windows package diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows-package-install-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/windows-x64-package/CMakeFiles/**
