name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

permissions:
  contents: read

jobs:
  native-macos:
    name: Native Qt build and tests (macOS)
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: brew install cmake ninja qt

      - name: Configure native debug build
        run: cmake --preset macos-debug

      - name: Build native targets
        run: cmake --build --preset macos-debug --parallel 3

      - name: Run native tests
        run: ctest --preset macos-debug --output-on-failure

      - name: Upload native test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/macos-debug-xcode/Testing/Temporary/**

  native-quality:
    name: Native format, static analysis, and sanitizers (macOS)
    runs-on: macos-14
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install native quality dependencies
        run: brew install cmake ninja qt llvm

      - name: Configure format check
        run: cmake --preset macos-format

      - name: Check native formatting
        run: cmake --build --preset macos-format --parallel 3

      - name: Configure static analysis
        run: cmake --preset macos-analysis

      - name: Run static analysis
        run: cmake --build --preset macos-analysis --parallel 3

      - name: Configure sanitizer build
        run: cmake --preset macos-sanitize

      - name: Build sanitizer targets
        run: cmake --build --preset macos-sanitize --parallel 3

      - name: Run sanitizer tests
        run: ctest --preset macos-sanitize --output-on-failure

      - name: Upload quality diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-quality-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/macos-analysis/compile_commands.json
            build/macos-sanitize-xcode/Testing/Temporary/**

  native-linux:
    name: Native Qt build and tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restore Qt SDK cache
        id: qt-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: qt-6.11.1-linux-gcc-64-v1-${{ hashFiles('native/dependencies/manifest.json') }}
          path: ${{ runner.temp }}/Qt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            ninja-build \
            xvfb

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/qt-online-installer.run" \
            https://download.qt.io/official_releases/online_installers/qt-online-installer-linux-x64-online.run
          chmod +x "$RUNNER_TEMP/qt-online-installer.run"
          "$RUNNER_TEMP/qt-online-installer.run" \
            --root "$RUNNER_TEMP/Qt" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install qt.qt6.6111.linux_gcc_64

      - name: Configure native debug build
        run: cmake --preset linux-debug -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/6.11.1/gcc_64"

      - name: Build native targets
        run: cmake --build --preset linux-debug --parallel 3

      - name: Run native tests
        run: xvfb-run -a ctest --preset linux-debug --output-on-failure

      - name: Upload native test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-linux-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/linux-debug/Testing/Temporary/**

  native-windows:
    name: Native Qt build and tests (Windows)
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Restore Qt SDK cache
        id: qt-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          key: qt-6.11.1-windows-msvc2022-64-v1-${{ hashFiles('native/dependencies/manifest.json') }}
          path: ${{ runner.temp }}\Qt

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\qt-online-installer.exe"
          Invoke-WebRequest -Uri https://download.qt.io/official_releases/online_installers/qt-online-installer-windows-x64-online.exe -OutFile $installer
          & $installer `
            --root "$env:RUNNER_TEMP\Qt" `
            --accept-licenses `
            --default-answer `
            --confirm-command `
            install qt.qt6.6111.win64_msvc2022_64
          if ($LASTEXITCODE -ne 0) { throw "Qt installer failed with exit code $LASTEXITCODE" }

      - name: Configure native debug build
        shell: pwsh
        run: cmake --preset windows-debug -A x64 -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP\Qt\6.11.1\msvc2022_64"

      - name: Build native targets
        run: cmake --build --preset windows-debug --parallel 3

      - name: Run native tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --preset windows-debug --output-on-failure

      - name: Upload native test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/windows-debug/Testing/Temporary/**

  native-macos-smoke:
    name: Native Qt shell smoke (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: brew install cmake ninja qt

      - name: Configure native debug build
        run: cmake --preset macos-debug

      - name: Build native shell smoke targets
        run: cmake --build --preset macos-debug --target hcb_native hcb_native_qml_shell_smoke --parallel 3

      - name: Run native shell smoke test
        run: ctest --preset macos-debug --tests-regex '^hcb_native_qml_shell_smoke$' --output-on-failure

      - name: Upload native shell smoke diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-smoke-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/macos-debug-xcode/Testing/Temporary/**

  native-performance-report:
    name: Native performance report
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: brew install cmake ninja qt

      - name: Configure native build
        run: cmake --preset macos-debug

      - name: Build native report runner
        run: cmake --build --preset macos-debug --target hcb_native hcb_performance_report --parallel 3

      - name: Generate report-only native performance JSON
        run: |
          mkdir -p artifacts/native-performance
          build/macos-debug-xcode/native/Debug/hcb_performance_report \
            --executable "build/macos-debug-xcode/native/Debug/Hot Cross Buns.app/Contents/MacOS/Hot Cross Buns" \
            --launch-iterations 3 \
            --idle-duration-ms 1000 \
            --timeout-ms 30000 \
            -- -platform offscreen \
            > artifacts/native-performance/macos.json
          jq --exit-status '.schema_version == 1 and .launch.iterations == 3 and .idle_rss.bytes > 0' \
            artifacts/native-performance/macos.json

      - name: Upload native performance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-performance-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/native-performance/macos.json
