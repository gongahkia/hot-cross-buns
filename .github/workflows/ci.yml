name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.8.13"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Check formatting
        run: uv run ruff format --check src tests tools/benchmark_python.py

      - name: Lint
        run: uv run ruff check src tests tools/benchmark_python.py

      - name: Type check
        run: uv run mypy src

      - name: Test
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Test isolated wheel install and entrypoint
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/hcb-wheel"
          uv pip install --python "$RUNNER_TEMP/hcb-wheel/bin/python" dist/*.whl
          test "$("$RUNNER_TEMP/hcb-wheel/bin/hcb" --json-schema-version)" = "1"
          TERM=dumb NO_COLOR=1 "$RUNNER_TEMP/hcb-wheel/bin/hcb" --help > /dev/null
