name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  native-macos:
    name: Native Qt build and tests (macOS)
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: brew install cmake ninja qt

      - name: Configure native debug build
        run: cmake --preset macos-debug

      - name: Build native targets
        run: cmake --build --preset macos-debug --parallel 3

      - name: Run native tests
        run: ctest --preset macos-debug --output-on-failure

      - name: Upload native test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/macos-debug-xcode/Testing/Temporary/**

  native-linux:
    name: Native Qt build and tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HCB_QT_ROOT: ${{ runner.temp }}/Qt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Qt SDK cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          key: qt-6.11.1-linux-gcc-64-v1-${{ hashFiles('native/dependencies/manifest.json') }}
          path: ${{ runner.temp }}/Qt

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-dev \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            ninja-build \
            xvfb

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/qt-online-installer.run" \
            https://download.qt.io/official_releases/online_installers/qt-online-installer-linux-x64-online.run
          chmod +x "$RUNNER_TEMP/qt-online-installer.run"
          "$RUNNER_TEMP/qt-online-installer.run" \
            --root "$HCB_QT_ROOT" \
            --accept-licenses \
            --default-answer \
            --confirm-command \
            install qt.qt6.6111.linux_gcc_64

      - name: Configure native debug build
        run: cmake --preset linux-debug -DCMAKE_PREFIX_PATH="$HCB_QT_ROOT/6.11.1/gcc_64"

      - name: Build native targets
        run: cmake --build --preset linux-debug --parallel 3

      - name: Run native tests
        run: xvfb-run -a ctest --preset linux-debug --output-on-failure

      - name: Upload native test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/linux-debug/Testing/Temporary/**

  native-windows:
    name: Native Qt build and tests (Windows)
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      HCB_QT_ROOT: ${{ runner.temp }}\Qt
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Qt SDK cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          key: qt-6.11.1-windows-msvc2022-64-v1-${{ hashFiles('native/dependencies/manifest.json') }}
          path: ${{ runner.temp }}\Qt

      - name: Install Qt 6.11.1
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\qt-online-installer.exe"
          Invoke-WebRequest -Uri https://download.qt.io/official_releases/online_installers/qt-online-installer-windows-x64-online.exe -OutFile $installer
          & $installer `
            --root $env:HCB_QT_ROOT `
            --accept-licenses `
            --default-answer `
            --confirm-command `
            install qt.qt6.6111.win64_msvc2022_64
          if ($LASTEXITCODE -ne 0) { throw "Qt installer failed with exit code $LASTEXITCODE" }

      - name: Configure native debug build
        shell: pwsh
        run: cmake --preset windows-debug -A x64 -DCMAKE_PREFIX_PATH="$env:HCB_QT_ROOT\6.11.1\msvc2022_64"

      - name: Build native targets
        run: cmake --build --preset windows-debug --parallel 3

      - name: Run native tests
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --preset windows-debug --output-on-failure

      - name: Upload native test diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/windows-debug/Testing/Temporary/**

  native-macos-smoke:
    name: Native Qt shell smoke (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: brew install cmake ninja qt

      - name: Configure native debug build
        run: cmake --preset macos-debug

      - name: Build native shell smoke targets
        run: cmake --build --preset macos-debug --target hcb_native hcb_native_qml_shell_smoke --parallel 3

      - name: Run native shell smoke test
        run: ctest --preset macos-debug --tests-regex '^hcb_native_qml_shell_smoke$' --output-on-failure

      - name: Upload native shell smoke diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: native-macos-smoke-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/macos-debug-xcode/Testing/Temporary/**

  electron-smoke:
    name: Electron smoke on macOS
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Electron smoke
        run: pnpm test:smoke

      - name: Upload smoke artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            output/playwright/**
            test-results/**
            playwright-report/**
            artifacts/release/**

  performance-smoke:
    name: Performance smoke
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Performance smoke
        run: pnpm test:perf

      - name: Upload performance artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: performance-smoke-artifacts-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/perf/**
            output/playwright/**

  native-performance-report:
    name: Native performance report
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: brew install cmake ninja qt

      - name: Configure native build
        run: cmake --preset macos-debug

      - name: Build native report runner
        run: cmake --build --preset macos-debug --target hcb_native hcb_performance_report --parallel 3

      - name: Generate report-only native performance JSON
        run: |
          mkdir -p artifacts/native-performance
          build/macos-debug-xcode/native/Debug/hcb_performance_report \
            --executable "build/macos-debug-xcode/native/Debug/Hot Cross Buns.app/Contents/MacOS/Hot Cross Buns" \
            --launch-iterations 3 \
            --idle-duration-ms 1000 \
            --timeout-ms 30000 \
            -- -platform offscreen \
            > artifacts/native-performance/macos.json
          jq --exit-status '.schema_version == 1 and .launch.iterations == 3 and .idle_rss.bytes > 0' \
            artifacts/native-performance/macos.json

      - name: Upload native performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-performance-report-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/native-performance/macos.json
