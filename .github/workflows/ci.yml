name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [1.85.0, stable]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Build workspace
        run: cargo +${{ matrix.toolchain }} build --workspace
      - name: Test workspace
        run: cargo +${{ matrix.toolchain }} test --workspace
      - name: Lint workspace
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --all-features -- -D warnings

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: RustSec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998

  release-smoke:
    name: release-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build release workspace
        run: cargo build --workspace --release

  godot-matrix:
    name: Godot support matrix
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.matrix.outputs.branches }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: matrix
        name: Read reviewed matrix
        shell: python
        run: |
          import json
          import tomllib
          with open("config/godot-support.toml", "rb") as source:
              matrix = tomllib.load(source)
          branches = [
              {"series": branch["series"], "version": branch["version"]}
              for branch in matrix["branch"]
          ]
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as output:
              output.write(f"branches={json.dumps(branches, separators=(',', ':'))}\n")

  godot-validate:
    name: Godot validation (${{ matrix.branch.series }} ${{ matrix.branch.version }})
    needs: godot-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.godot-matrix.outputs.branches) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Provision reviewed Godot release
        env:
          GODOT_VERSION: ${{ matrix.branch.version }}
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 --retry-delay 2 --output "$archive" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$archive"
          unzip -q "$archive" -d .godot-bin
          chmod +x ".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Validate package-free fixture in recovery mode
        env:
          GODOT_VERSION: ${{ matrix.branch.version }}
        run: |
          cargo +1.85.0 run -p wukong-cli -- validate --project fixtures/validation/minimal --godot-executable ".godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64" --timeout-seconds 60

  native-transactions:
    name: native transactions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Run native transaction fixtures
        run: cargo +1.85.0 test -p wukong-core --test native_transaction_fixtures -- --test-threads=1

  release-artifacts:
    name: release artifact (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: wukong
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: wukong
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: wukong
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            binary: wukong.exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add ${{ matrix.target }} --toolchain 1.85.0
      - name: Configure Windows GNU linker
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          $linker = (Get-Command gcc -ErrorAction Stop).Source
          if ((& $linker -dumpmachine) -ne 'x86_64-w64-mingw32') {
            throw "Windows runner gcc is not an x86_64 MinGW linker: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native release archive
        shell: bash
        run: |
          version="$(cargo +1.85.0 run --quiet --package wukong-cli -- --version | sed -n 's/^wukong //p')"
          test -n "$version"
          scripts/package-release.sh "$version" "${{ matrix.target }}" release-artifacts
      - name: Verify archive contents, checksum, and native executable
        shell: bash
        run: |
          version="$(cargo +1.85.0 run --quiet --package wukong-cli -- --version | sed -n 's/^wukong //p')"
          archive="release-artifacts/wukong-$version-${{ matrix.target }}.zip"
          test -s "$archive"
          test "$(unzip -Z1 "$archive")" = "${{ matrix.binary }}"
          unzip -t "$archive"
          (
            cd release-artifacts
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 -c "$(basename "$archive").sha256"
            else
              sha256sum -c "$(basename "$archive").sha256"
            fi
          )
          stage="$(mktemp -d)"
          unzip -q "$archive" -d "$stage"
          test "$("$stage/${{ matrix.binary }}" --version)" = "wukong $version"
      - name: Upload verified archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wukong-${{ matrix.target }}
          path: |
            release-artifacts/wukong-*.zip
            release-artifacts/wukong-*.zip.sha256
          if-no-files-found: error
          retention-days: 7
