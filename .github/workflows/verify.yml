name: Hot Cross Buns CI/CD on Push

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build and typecheck
        run: pnpm build
      - name: Production shell and offline recovery tests
        run: pnpm test:production && pnpm test:offline
      - name: Unit and mocked Google transport tests
        run: pnpm test:unit
      - name: SQLite domain regression tests
        run: pnpm test:db
      - name: Browser interaction and IndexedDB persistence tests
        run: pnpm test:ui
      - name: Measure mixed workspace performance
        if: matrix.os == 'ubuntu-latest'
        run: pnpm measure:storage
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            output/playwright/
            output/playwright-report/
            output/playwright-results.xml
            output/ui-review/
            output/offline-validation.json
            docs/performance/browser-mixed.json

# Google transport and consent handling are tested with mocked services; live consent requires a configured OAuth project.
# The dist/ directory is the static web distribution.
