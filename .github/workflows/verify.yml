name: Hot Cross Buns CI/CD on Push

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture-diagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Verify generated architecture diagram
        run: uv run --python 3.11 --with-requirements requirements-architecture.txt python scripts/generate_architecture_diagram.py --check
      - name: Require architecture-model review for boundary changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed_files="$(git diff --name-only "origin/${BASE_REF}"...HEAD)"
          if echo "$changed_files" | grep -Eq '^(src/main/index\.ts|src/main/ipc/|src/main/security|src/main/services/(coreStore|googleOAuth|googleSync|serviceContainer)\.ts|src/preload/)'; then
            if ! echo "$changed_files" | grep -qx 'scripts/generate_architecture_diagram.py'; then
              echo "An architecture-sensitive boundary changed. Review and update scripts/generate_architecture_diagram.py, then regenerate the diagram."
              exit 1
            fi
          fi
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v5
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm build
      - name: Unit and mocked Google transport tests
        run: pnpm test:unit
      - name: Electron SQLite tests
        run: pnpm test:db
      - name: Electron launch smoke
        run: xvfb-run -a pnpm exec playwright test -c playwright.config.ts

# Live Google tests, performance scale tests, packaging, signing, and
# notarization intentionally remain release/operator actions. They need a
# user-owned signed-in profile, controlled hardware, or private credentials.
