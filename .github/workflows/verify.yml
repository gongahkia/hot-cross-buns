name: Hot Cross Buns CI/CD on Push

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and typecheck
        run: pnpm build
      - name: Unit and mocked Google transport tests
        run: pnpm test:unit
      - name: Electron SQLite tests
        run: pnpm test:db
      - name: Electron interaction and persistence tests
        run: pnpm test:ui
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            output/playwright/
            output/playwright-report/
            output/playwright-results.xml
            output/ui-review/

# Live Google tests, performance scale tests, packaging, signing, and
# notarization intentionally remain release/operator actions. They need a
# user-owned signed-in profile, controlled hardware, or private credentials.
