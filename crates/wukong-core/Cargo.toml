[package]
name = "wukong-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
asset-library = ["dep:serde_json"]

[dependencies]
fs2 = "0.4.3"
pubgrub = "=0.3.0"
reflink-copy = "0.1.30"
serde_json = { version = "1.0.149", optional = true }
semver = "1.0.28"
sha2 = "0.10.9"
toml_edit = "0.25.13"
tempfile = "3.27.0"
unicode-normalization = "0.1.25"
url = "2.5.8"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
proptest = "1.11.0"

[[bench]]
name = "resolver_baseline"
harness = false

[[bench]]
name = "component_harness"
harness = false
