[package]
name = "wukong-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "wukong"
path = "src/main.rs"

[lints]
workspace = true

[features]
asset-library = ["wukong-core/asset-library"]

[dependencies]
ctrlc = "3.5.2"
indicatif = "0.18.6" # TTY-only package progress without custom terminal control code
serde_json = "1.0.151"
wukong-core.workspace = true

[dev-dependencies]
sha2 = "0.10.9" # computes immutable archive fixture checksums
tempfile = "3.27.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] } # creates deterministic catalog archive fixtures
