[package]
name = "wukong-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wukong"
path = "src/main.rs"

[lints]
workspace = true

[features]
asset-library = ["wukong-core/asset-library"]

[dependencies]
ctrlc = "3.5.2"
serde_json = "1.0.151"
wukong-core = { path = "../wukong-core" }

[dev-dependencies]
tempfile = "3.27.0"
