services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in selfhost/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in selfhost/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in selfhost/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - hcb-postgres:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ../backend
    command: ["npm", "run", "worker"]
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../web
      args:
        VITE_HCB_SELF_HOSTED_RELIABILITY_ENABLED: "true"

  gateway:
    image: caddy:2.8-alpine
    environment:
      HCB_DOMAIN: ${HCB_DOMAIN:?set HCB_DOMAIN in selfhost/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - hcb-caddy-data:/data
      - hcb-caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  hcb-postgres:
  hcb-caddy-data:
  hcb-caddy-config:
