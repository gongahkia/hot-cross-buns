[package]
name = "wukong-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.12"
tempfile = "3.27.0"
wukong-core = { path = "../crates/wukong-core" }
zip = { version = "7.2.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "lockfile"
path = "fuzz_targets/lockfile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_catalog"
path = "fuzz_targets/source_catalog.rs"
test = false
doc = false
bench = false
