[workspace]
members = ["crates/wukong-core", "crates/wukong-cli"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Reproducible package manager for Godot 4 addons"
homepage = "https://github.com/gongahkia/wukong"
repository = "https://github.com/gongahkia/wukong"
keywords = ["godot", "addons", "package-manager", "dependencies"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
wukong-core = { path = "crates/wukong-core", version = "=0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
