[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hot-cross-buns"
version = "0.1.0"
description = "A local-first terminal client for tasks and calendars"
requires-python = ">=3.12"
dependencies = [
  "textual",
  "typer",
  "rich",
  "platformdirs",
  "keyring",
  "google-auth",
  "google-auth-oauthlib",
  "google-api-python-client",
]

[project.scripts]
hcb = "hcb.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/hcb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hcb"]
