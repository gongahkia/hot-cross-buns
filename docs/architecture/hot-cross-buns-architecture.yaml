# yaml-language-server: $schema=https://raw.githubusercontent.com/dmytrostriletskyi/diagrams-as-code/main/json-schemas/0.0.1.json
# Source of truth for docs/assets/hot-cross-buns-architecture.png.
# Render with: corepack pnpm architecture:generate
diagram:
  name: Hot Cross Buns current runtime architecture
  file_name: ../assets/hot-cross-buns-architecture
  format: png
  direction: left-to-right
  label_resources: false
  open: false
  style:
    graph:
      bgcolor: '#181818'
      fontcolor: '#fbf1c7'
      pad: '0.45'
      ranksep: '1.05'
      nodesep: '0.65'
      splines: ortho
    node:
      fontcolor: '#fbf1c7'
      fillcolor: '#32302f'
      color: '#83a598'
      margin: '0.18,0.12'
    edge:
      fontcolor: '#d5c4a1'
      color: '#a89984'
      fontsize: '10'
  resources:
    - id: desktop
      name: Hot Cross Buns desktop application
      type: cluster
      of:
        - id: user
          name: User
          type: onprem.client.User
          relates:
            - to: desktop.renderer
              direction: outgoing
              label: keyboard and mouse input
        - id: renderer
          name: React renderer
          type: programming.framework.React
          relates:
            - to: desktop.preload
              direction: outgoing
              label: typed window.hcb calls
        - id: preload
          name: Hardened preload bridge
          type: programming.language.TypeScript
          relates:
            - to: desktop.ipc
              direction: outgoing
              label: validated IPC
        - id: ipc
          name: Electron main IPC handlers
          type: programming.language.Nodejs
          relates:
            - to: desktop.core
              direction: outgoing
              label: allow-listed dispatch
        - id: core
          name: CoreStore and app services
          type: programming.language.TypeScript
          relates:
            - to: local.sqlite
              direction: outgoing
              label: cache, settings, outbox
            - to: local.credentials
              direction: outgoing
              label: encrypted credentials
            - to: desktop.sync
              direction: outgoing
              label: sync work
        - id: sync
          name: Google OAuth and sync services
          type: programming.language.TypeScript
          relates:
            - to: external.browser
              direction: outgoing
              label: explicit OAuth consent
            - to: external.google
              direction: outgoing
              label: direct Google API requests
        - id: native
          name: Native desktop adapters
          type: generic.blank.Blank
    - id: local
      name: Local device storage
      type: cluster
      of:
        - id: sqlite
          name: SQLite cache, settings, and durable outbox
          type: generic.database.SQL
        - id: credentials
          name: Electron safeStorage
          type: generic.storage.Storage
    - id: external
      name: Explicit external integrations
      type: cluster
      of:
        - id: browser
          name: Default browser
          type: generic.blank.Blank
        - id: google
          name: Google OAuth, Tasks, Calendar, Drive, and Gmail APIs
          type: generic.blank.Blank
