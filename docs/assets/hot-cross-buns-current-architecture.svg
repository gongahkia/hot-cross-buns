  <text x="62" y="912" fill="#d5c4a1" font-size="13"><tspan x="62" dy="0">Boundary note: Hot Cross Buns has no HCB cloud backend, supported Vault/hoster endpoint, or enabled local MCP listener. Google Tasks and Calendar are</tspan><tspan x="62" dy="20">the synced sources of truth; HCB keeps an encrypted local cache for speed, offline reads, and durable mutation delivery.</tspan></text>
