[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "a-slow-walk-level-mcp"
version = "0.1.0"
description = "Local MCP tools for a-slow-walk creative drafts"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0"]

[project.scripts]
a-slow-walk-level-mcp = "level_mcp.server:run_server"

[tool.setuptools]
packages = ["level_mcp"]
